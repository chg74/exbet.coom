<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التحديث الجديد</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Tahoma, Arial, sans-serif;
    overflow: hidden;
    background: #050505;
    color: white;
}

/* الخلفية */
.bg {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.75)),
        url("https://thanosx.icu/kotev2/IMG/MAFYA.GIF") center/cover no-repeat;
    filter: brightness(.75);
    transform: scale(1.03);
    z-index: -2;
}

/* تأثير داكن */
.overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(
        circle at center,
        rgba(0,0,0,.15),
        rgba(0,0,0,.82)
    );
    z-index: -1;
}

/* المحتوى */
.container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.box {
    width: min(430px, 94vw);
    padding: 35px 25px;
    text-align: center;
    border-radius: 22px;

    background: rgba(12,12,12,.78);
    border: 1px solid rgba(255,255,255,.12);

    box-shadow:
        0 20px 60px rgba(0,0,0,.7),
        inset 0 0 30px rgba(255,255,255,.025);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    animation: boxIn .8s ease;
}

@keyframes boxIn {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* دائرة التحميل */
.loader {
    width: 72px;
    height: 72px;
    margin: 0 auto 25px;
    border-radius: 50%;

    border: 4px solid rgba(255,255,255,.12);
    border-top-color: #fff;
    border-right-color: #777;

    animation: spin 1s linear infinite;

    box-shadow:
        0 0 25px rgba(255,255,255,.15);
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.title {
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 12px;
    letter-spacing: .3px;
}

.message {
    color: #cfcfcf;
    font-size: 15px;
    line-height: 1.8;
    min-height: 55px;
}

/* النقاط */
.dots {
    display: inline-flex;
    gap: 5px;
    margin-right: 4px;
}

.dots span {
    width: 5px;
    height: 5px;
    background: #fff;
    border-radius: 50%;
    animation: dots 1.2s infinite ease-in-out;
}

.dots span:nth-child(2) {
    animation-delay: .15s;
}

.dots span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes dots {
    0%, 80%, 100% {
        opacity: .25;
        transform: translateY(0);
    }

    40% {
        opacity: 1;
        transform: translateY(-5px);
    }
}

/* خط التحميل */
.progress {
    width: 100%;
    height: 5px;
    background: rgba(255,255,255,.1);
    border-radius: 20px;
    overflow: hidden;
    margin-top: 27px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #777, #fff);
    border-radius: 20px;
    animation: loading 8s infinite;
}

@keyframes loading {
    0% {
        width: 0%;
    }

    50% {
        width: 65%;
    }

    80% {
        width: 88%;
    }

    100% {
        width: 100%;
    }
}

.status {
    margin-top: 17px;
    font-size: 12px;
    color: #888;
}

/* موبايل */
@media (max-width: 480px) {
    .box {
        padding: 30px 20px;
    }

    .title {
        font-size: 20px;
    }

    .message {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="container">

    <div class="box">

        <div class="loader"></div>

        <div class="title">
            برجاء الانتظار
        </div>

        <div class="message">
            يتم الآن تحميل التحديث الجديد
            <span class="dots">
                <span></span>
                <span></span>
                <span></span>
            </span>
        </div>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>

        <div class="status">
            جاري التحقق من آخر إصدار...
        </div>

    </div>

</div>

<script>

const messages = [
    "يتم الآن تحميل التحديث الجديد",
    "برجاء الانتظار حتى يكتمل التحديث",
    "جاري تجهيز الملفات الجديدة",
    "جاري التحقق من آخر إصدار",
    "جاري تطبيق التحديثات الجديدة"
];

let index = 0;

const message = document.querySelector(".message");

setInterval(() => {

    index++;

    if (index >= messages.length) {
        index = 0;
    }

    message.style.opacity = "0";

    setTimeout(() => {

        message.innerHTML =
            messages[index] +
            ` <span class="dots">
                <span></span>
                <span></span>
                <span></span>
              </span>`;

        message.style.opacity = "1";

    }, 300);

}, 3000);

</script>

</body>
    </html>
